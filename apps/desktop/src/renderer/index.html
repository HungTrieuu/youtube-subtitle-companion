<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>YouTube Subtitle Companion</title>
    <link
      rel="stylesheet"
      href="./overlay.css"
    />
  </head>
  <body>
    <main id="app">
      <header id="overlay-toolbar">
        <div id="drag-handle">Hold move hotkey and drag overlay</div>
        <button
          id="close-overlay-button"
          type="button"
          aria-label="Close subtitle overlay"
          title="Close subtitle overlay"
        >
          ×
        </button>
      </header>
      <section
        id="subtitle-card"
        tabindex="0"
        aria-live="polite"
      >
        <p id="subtitle-text">Waiting for YouTube subtitle feed...</p>
        <div id="status-line">Waiting for extension</div>
        <div id="debug-line"></div>
      </section>
      <aside
        id="word-popup"
        hidden
        role="dialog"
        aria-live="polite"
        aria-label="Learning actions"
      >
        <div id="word-popup-word"></div>
        <div id="word-popup-translation"></div>
        <div id="word-popup-phonetic"></div>
        <div id="word-popup-body"></div>
        <div id="word-popup-actions"></div>
      </aside>
      <div
        id="overlay-toast"
        hidden
        aria-live="polite"
      ></div>
    </main>
    <script src="./overlay.js"></script>
  </body>
</html>
